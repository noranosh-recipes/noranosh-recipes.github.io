<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Redirecting…</title>
</head>
<body>
<p id="m">Redirecting…</p>
<script id="maria-links" type="application/json">{"crispy-cheesy-beef-chimichangas":"https://noranosh.com/crispy-cheesy-beef-chimichangas/","crockpot-french-onion-meatloaf":"https://noranosh.com/crockpot-french-onion-meatloaf/","easy-chinese-ground-beef-and-cabbage-stir-fry":"https://noranosh.com/easy-chinese-ground-beef-and-cabbage-stir-fry/","easy-ground-beef-potato-skillet":"https://noranosh.com/easy-ground-beef-potato-skillet/","easy-keto-chili":"https://noranosh.com/easy-keto-chili/","easy-taco-soup-with-ground-beef":"https://noranosh.com/easy-taco-soup-with-ground-beef/","french-onion-ground-beef-and-rice-casserole":"https://noranosh.com/french-onion-ground-beef-and-rice-casserole/","french-onion-ground-beef-rice-casserole-2":"https://noranosh.com/french-onion-ground-beef-rice-casserole-2/","garlic-butter-cheeseburger-rollups":"https://noranosh.com/garlic-butter-cheeseburger-rollups/","ground-beef-and-sweet-potato-skillet":"https://noranosh.com/ground-beef-and-sweet-potato-skillet/"}</script>
<script>
(function () {
  var links = JSON.parse(document.getElementById("maria-links").textContent);
  var parts = location.search.replace(/^\?/, "").split("&");
  var slug = "";
  try { slug = decodeURIComponent(parts.shift() || ""); } catch (e) {}
  slug = slug.toLowerCase().replace(/\/+$/, "");
  var to = links[slug];
  if (!to) { document.title = "Page not found"; document.getElementById("m").textContent = "Page not found."; return; }
  var extra = parts.filter(Boolean).join("&");
  if (extra) {
    var h = to.indexOf("#"), hash = h < 0 ? "" : to.slice(h), u = h < 0 ? to : to.slice(0, h);
    to = u + (u.indexOf("?") < 0 ? "?" : "&") + extra + hash;
  }
  location.replace(to);
})();
</script>
</body>
</html>
